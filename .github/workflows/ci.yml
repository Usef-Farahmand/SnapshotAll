name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile snapshot_*.py
      - name: Lint (errors only)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 .
      - name: Smoke test CLI
        run: python snapshot_all.py --help
